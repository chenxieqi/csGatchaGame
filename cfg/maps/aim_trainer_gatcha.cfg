// convars to exec on map load
// Runs before the map spawns, so these apply from the first round without mp_restartgame
// (a round restart cleans up map entities and the showcase props can no longer be found).
mp_do_warmup_period 0
mp_warmuptime 0
mp_team_intro_time 0
mp_freezetime 0
mp_ignore_round_win_conditions 1
mp_roundtime 60
mp_startmoney 16000